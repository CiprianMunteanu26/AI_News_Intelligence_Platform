name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install ruff==0.17.3 requests==2.32.5

      - name: Lint source and scripts
        run: ruff check src scripts tests

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Run offline inference tests
        run: python -m unittest discover -s tests -v
